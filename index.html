<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Interactive Wall — prototype</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #07080a; overflow: hidden;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfd6df;
      }
      #wall { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
      #overlay {
        position: fixed; inset: 0; pointer-events: none;
        width: 100vw; height: 100vh;
      }
      #hud {
        position: fixed; top: 10px; left: 10px; pointer-events: none;
        padding: 10px 12px; border-radius: 6px;
        background: rgba(8, 10, 14, 0.62);
        border: 1px solid rgba(140, 160, 190, 0.16);
        backdrop-filter: blur(6px);
        white-space: pre; letter-spacing: 0.02em;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      #hud .dim { color: #6d7887; }
      #hud .hot { color: #7ee0c0; }
      #hud .warn { color: #f0b060; }
      #help {
        position: fixed; bottom: 10px; left: 10px; pointer-events: none;
        color: #5d6875; white-space: pre;
      }
      #fatal {
        position: fixed; inset: 0; display: none; place-content: center;
        padding: 8vw; background: #120607; color: #ffb4b4;
        font-size: 14px; line-height: 1.6; white-space: pre-wrap;
      }
      #fatal.show { display: grid; }
      #fatal b { color: #ff7676; font-size: 18px; }
      .lil-gui { --font-size: 11px; --background-color: rgba(8,10,14,0.72); }
    </style>
  </head>
  <body>
    <canvas id="wall"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud"></div>
    <div id="help"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
